<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar anúncio | Poketplace</title>
  <link rel="icon" href="../img/logo-prisma.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/api.js"></script>
  <script defer src="../js/storage.js"></script>
  <script defer src="../js/ui-helpers.js"></script>
  <script defer src="../js/edicao.js"></script>
</head>
<body>
  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <a class="marca" href="../index.html">
        <img class="marca-icone" src="../img/logo-prisma.svg" alt="">
        <span>Poketplace</span>
      </a>
      <nav class="navegacao">
        <a href="../index.html">Painel</a>
        <a class="ativo" href="listagem.html">Mercado</a>
        <a href="cadastro.html">Anunciar</a>
      </nav>
    </div>
  </header>

  <section class="hero hero-compacto">
    <div class="container hero-conteudo">
      <div class="hero-texto">
        <p class="hero-etiqueta">Área do vendedor</p>
        <h1 class="hero-titulo">Gerenciar anúncio</h1>
        <p class="hero-descricao">Ajuste preço, condição, descrição e status da carta anunciada.</p>
      </div>
      <div class="hero-carta">
        <img src="../img/icone-gema.svg" alt="" width="140">
      </div>
    </div>
    <div class="hero-curva"></div>
  </section>

  <main class="container conteudo">
    <p class="mensagem oculto" id="mensagem-edicao"></p>

    <section class="painel oculto" id="painel-edicao">
      <div class="previa">
        <img id="previa-imagem" src="../img/carta-placeholder.svg" alt="Carta do anúncio">
        <div class="previa-dados">
          <h3 id="previa-nome"></h3>
          <p class="campo-ajuda" id="previa-detalhes"></p>
          <p id="previa-status"></p>
        </div>
      </div>

      <form class="formulario" id="formulario-edicao" novalidate>
        <div class="campo">
          <label for="preco">Preço</label>
          <div class="entrada-prefixo">
            <span>R$</span>
            <input type="text" id="preco" inputmode="decimal" placeholder="0,00" autocomplete="off">
          </div>
        </div>
        <div class="campo">
          <label for="condicao">Condição</label>
          <select id="condicao">
            <option value="">Selecione a condição</option>
            <option value="Nova/Lacrada">Nova/Lacrada</option>
            <option value="Excelente">Excelente</option>
            <option value="Boa">Boa</option>
            <option value="Jogada">Jogada</option>
            <option value="Danificada">Danificada</option>
          </select>
        </div>
        <div class="campo">
          <label for="vendedor">Vendedor</label>
          <input type="text" id="vendedor" readonly>
        </div>

        <div class="campo campo-largo">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" maxlength="300"></textarea>
          <span class="campo-ajuda"><span id="contador-descricao">0</span>/300 caracteres</span>
        </div>

        <div class="campo-largo grupo-botoes">
          <button class="botao" type="submit">Salvar alterações</button>
          <button class="botao botao-sucesso" type="button" id="botao-vendida">Marcar vendida</button>
          <button class="botao botao-destaque" type="button" id="botao-reservada">Marcar reservada</button>
          <button class="botao botao-perigo" type="button" id="botao-excluir">Excluir anúncio</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">Poketplace · protótipo acadêmico de Laboratório de Programação · dados das cartas: Pokémon TCG API</div>
  </footer>
</body>
</html>
