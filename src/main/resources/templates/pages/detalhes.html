<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do anúncio | Poketplace</title>
  <link rel="icon" href="../img/logo-prisma.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/api.js"></script>
  <script defer src="../js/storage.js"></script>
  <script defer src="../js/ui-helpers.js"></script>
  <script defer src="../js/detalhes.js"></script>
</head>
<body>
  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <a class="marca" href="../index.html">
        <img class="marca-icone" src="../img/logo-prisma.svg" alt="">
        <span>Poketplace</span>
      </a>
      <nav class="navegacao">
        <a href="../index.html">Painel</a>
        <a class="ativo" href="listagem.html">Mercado</a>
        <a href="cadastro.html">Anunciar</a>
      </nav>
    </div>
  </header>

  <section class="hero hero-compacto">
    <div class="container hero-conteudo">
      <div class="hero-texto">
        <p class="hero-etiqueta">Anúncio</p>
        <h1 class="hero-titulo">Detalhes da carta</h1>
        <p class="hero-descricao">Informações completas da carta anunciada.</p>
      </div>
      <div class="hero-carta">
        <img src="../img/icone-medalha.svg" alt="" width="140">
      </div>
    </div>
    <div class="hero-curva"></div>
  </section>

  <main class="container conteudo">
    <section class="painel">
      <p class="mensagem oculto" id="mensagem-detalhes"></p>
      <div class="detalhe" id="detalhe-anuncio"></div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">Poketplace · protótipo acadêmico de Laboratório de Programação · dados das cartas: Pokémon TCG API</div>
  </footer>
</body>
</html>
