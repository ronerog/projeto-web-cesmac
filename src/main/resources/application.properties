spring.application.name=pokemon-web

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pokemon_web}
spring.datasource.username=${DB_USERNAME:pokemon}
spring.datasource.password=${DB_PASSWORD:pokemon}

# O schema é criado e versionado pelo Flyway (src/main/resources/db/migration);
# o Hibernate só confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
