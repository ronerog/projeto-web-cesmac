spring.application.name=pokemon-web

# Nos testes usamos H2 em memória no modo de compatibilidade com PostgreSQL,
# rodando as mesmas migrações do Flyway.
spring.datasource.url=jdbc:h2:mem:pokemon_web;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
